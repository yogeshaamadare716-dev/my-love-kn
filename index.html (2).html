<!DOCTYPE html>
<html lang="hi">
    <head>
        <meta charset="utf-8">
            <meta name="viewport"
            content="width=device-width,initial-scale=1.0">
            <title>A special Question</title>
            <style>
                body{
                    display:flex;
                    justify-content:center
                    align-items;center
                    height:100vh;
                    margin:0;
                    background:linear-gradient(135deg, #ff9a9c 0%,#fecfef 100%);
                    font-family: 'poppins',sans-serif;
                    text-align: center;
                    overflow:hidden
                }
                .card{
                    background:white;
                    padding:30px
                    border-radius:20px
                    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                    max-width:380px;
                    width:90%;
                }
                h1{
                    color:#d63384;
                    font-size:24px;
                    margin-bottom:20px
                }
                .btn-container{
                    display:flex;
                    justify-content:center;
                    gap:15px;
                    margin-top:20px;
                    position:relative;
                    min-height:50px;
                }
                button {
                    padding:12px 25px;
                    font-size:16px;
                    font-weight:bold;
                    border:none;
                    border-radius:25px;
                    cursor:pointer;
                    transition:0,2s;
                }
                #yesbtn{
                    background-color: #d63384;
                    color:white;
                }
                #nobtn{
                    background-color:#dc3545;
                    color:white;
                    position:absolute;
                }
                #message{
                    display:none;
                    font-size:20px>
                    color:#d62384;
                    font-weight:bold;
                    margin-top 20px
                }
                </style>
                </head>
                <body>
                    <div class="card">
                        <h1 id="question">will you be my special person?</h1>
                        <div class="btn-container" id="btnGroup">
                        <button id="yesbtn" onclick="celebrate()">YES</button>
                        <button id="nobtn" onmouseover="movebutton()" onclick="movebutton()">NO</button>
                        </div>
                        <div id="message">
                            yaaah! i like you so much!
                        </div>
                    </div>
                    <script>
                        function movebutton(){
                            let x =Math.random()*(window.innerWidth-100);
                            let y =Math.random()*(window.innerHeight-50);
                            let nobtn = document.getElementByid("nobtn");
                            nobtn.style.left = x + "px";
                            nobtn.style.top = y + "px";
                         }
                         function celebrate(){
                            document.getlEntByid("question").style.display = "none";
                            document.getelEnentByid("btnGroup").style.display = "none";
                            document.getelEnentByid("message").style.display = "block";
                         }
                         </script>
                </body>
</html>
